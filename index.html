	<!DOCTYPE html>
	<html>
		<head>
			<meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1">
			<title>MoniePoint MFB Registrstion Page</title>
			<link rel="stylesheet" type="text/css" href="CSS/registration-style.css">
		</head>
		<body>
			<header id="main-header">
				<div>
					<img id="main-logo" src="Images/Monielogo.jpg" alt="MoniePoint Logo">

					<h2>Welcome, Thanks for choosing our bank.</h2>
					<h5><em>Create your moniepoint account...</em></h5>
				</div>
			</header>

			<div>
				<section class="main-form">
					<form action="customers.php" method="post">
										<label>First Name:</label>
			<div>
							<input type="text" name="first-name" placeholder="Enter your first name">
						</div>
						
						<div>
							<label>Last Name:</label>
							<input type="text" name="last-name" placeholder="Enter your last name">
						</div>
						

						<div>
							<label>Email:</label>
							<input type="email" name="email" placeholder="12345@gmail">
						</div>
						

						<div>
							<label>Phone Number:</label>
							<input type="text" name="phone-number" placeholder="Enter your phone number">
						</div>
						

						<div>
							<label>Password:</label>
							<input type="Password" name="password">
						</div>
						

						<div>
							<label>Confirm Password:</label>
							<input type="Password" name="confirm-password">
						</div>

						<div>
							<button type="submit">Register</button>
						</div>
					</form>
				</section>
			</div>

		</body>
	</html>
